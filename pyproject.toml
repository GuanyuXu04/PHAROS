[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pharos"
version = "0.1.0"
description = "Optical tomography of a soft waveguide membrane: photodiode readings to 3D shape reconstruction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "torch",
]

[project.optional-dependencies]
# Live inference and data acquisition (tools/)
hardware = ["pyserial", "open3d", "opencv-python", "pyrealsense2"]

[tool.setuptools]
packages = ["pharos"]
